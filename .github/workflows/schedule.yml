name: Chequeo nocturno de dependencias

on:
  schedule:
    - cron: "0 3 * * *"

jobs:
  chequear:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Configurar Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - name: Buscar gemas desactualizadas
        run: bundle outdated || true