name: Matrix build worflow
on:
  push:
    branches:
      - main

job:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        ruby-version: ['3.3', '3.4']
      steps:
        - uses: actions/checkout@v5
        - uses: ruby/setup-ruby@v1
          with:
            ruby-version: ${{ matrix.ruby-version }}
            bundler-cache: true
        - run: bundle exec respec