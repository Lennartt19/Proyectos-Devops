name: Matrix build worflow
on:
  push:
    branches-ignore:
      - main

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
        ruby-version: ['3.3', '3.4']
        exclude:
          - os: macos-latest
            ruby-version: '3.3'
        include:
          - os: windows-latest
            ruby-version: '3.4'
            experimental-gem: true
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - run: bundle exec rspec